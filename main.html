<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR.js Location-Based 3D Model</title>
    <!-- A-Frame and AR.js libraries -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
    <script>
        // Register a component to handle model loading and positioning
        AFRAME.registerComponent('gps-model', {
            init: function() {
                this.el.addEventListener('model-loaded', () => {
                    // Once the model is loaded, we can adjust its scale or other properties
                    const model = this.el.getObject3D('mesh');
                    if (model) {
                        // Adjust scale if needed
                        this.el.setAttribute('scale', '0.5 0.5 0.5');
                        console.log('Model loaded successfully');
                    }
                });
            }
        });
    </script>
    <style>
        .ar-button {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            border-radius: 5px;
            z-index: 999;
        }
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .loading-message {
            font-size: 24px;
            margin-bottom: 20px;
        }
        .instructions {
            font-size: 16px;
            max-width: 80%;
            text-align: center;
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">
    <!-- Loading screen -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-message">Loading AR Experience</div>
        <div class="instructions">
            Please allow camera and location access when prompted.<br>
            Point your camera around to detect surfaces.
        </div>
    </div>

    <!-- A-Frame scene -->
    <a-scene 
        vr-mode-ui="enabled: false"
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false; sourceWidth: 1280; sourceHeight: 960; displayWidth: 1280; displayHeight: 960;"
        renderer="logarithmicDepthBuffer: true; precision: medium;"
        onload="document.getElementById('loadingScreen').style.display = 'none';">
        
        <!-- Camera with GPS capabilities -->
        <a-camera
            gps-camera="minDistance: 1; maxDistance: 100000"
            rotation-reader
            look-controls="reverseMouseDrag: true">
        </a-camera>
        
        <!-- 3D Model at specific GPS coordinates -->
        <a-entity
            gltf-model="./assets/fields.glb"
            gps-entity-place="latitude: 43.078861; longitude: -77.671736;"
            gps-model
            animation-mixer
            position="0 0 0"
            rotation="0 0 0"
            scale="0.5 0.5 0.5">
        </a-entity>
    </a-scene>

    <!-- UI Controls -->
    <button class="ar-button" id="resetButton">Reset Position</button>

    <script src="./js/app.js"></script>
</body>
</html>
